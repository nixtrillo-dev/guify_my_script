name: Mirror Release to GitHub
on:
  release:
    types: [published]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        id: create_gh_release
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GH_MIRROR_TOKEN }}
          script: |
            const release = context.payload.release;
            const result = await github.rest.repos.createRelease({
              owner: 'nixtrillo-dev',
              repo: 'guify_my_script',
              tag_name: release.tag_name,
              name: release.name,
              body: release.body,
              draft: release.draft,
              prerelease: release.prerelease
            });
            return result.data;

      - name: Download Assets from Private Forgejo
        uses: actions/forgejo-release@v2
        with:
          direction: download
          url: ${{ secrets.FORGEJO_INSTANCE_URL }} 
          repo: nixtrillo-dev/guify_my_script
          tag: ${{ github.event.release.tag_name }}
          release-dir: ./dist 
          token: ${{ secrets.FORGEJO_TOKEN }} 

      - name: Upload Assets to GitHub
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GH_MIRROR_TOKEN }}
          script: |
            const fs = require('fs').promises;
            const path = require('path');
            const githubRelease = ${{ steps.create_gh_release.outputs.result }};
            const assetDir = './dist';

            const files = await fs.readdir(assetDir);
            for (const file of files) {
              const filePath = path.join(assetDir, file);
              const fileData = await fs.readFile(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner: 'nixtrillo-dev',
                repo: 'guify_my_script',
                release_id: githubRelease.id,
                name: file,
                data: fileData,
              });
              console.log(`Uploaded ${file}`);
            }